<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color"
        content="#071827">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Andre & Intan — Wedding Invitation</title>

  <!-- Google Fonts -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet"
        href="style.css">
</head>


<body>

  <!-- =====================================================
       SESSION 1
       OPENING INVITATION
  ====================================================== -->

  <main class="opening">

    <!--
      Background hanya menggunakan SATU gambar.
      Tidak ada gambar bunga tambahan.
      Tidak ada fade pada background.
    -->

    <section class="invitation-content">

      <!-- Logo -->
      <div class="logo-container">

        <img
          src="assets/logo-wedding.png"
          alt="Logo Andre & Intan"
          class="wedding-logo">

      </div>


      <!-- Small Title -->
      <p class="small-title">
        THE WEDDING OF
      </p>


      <!-- Nama Pengantin -->
      <h1 class="couple-name">

        <span>Andre</span>

        <span class="ampersand">
          &amp;
        </span>

        <span>Intan</span>

      </h1>


      <!-- Divider -->
      <div class="divider">

        <span></span>

        <b>✦</b>

        <span></span>

      </div>


      <!-- Nama Tamu -->
      <div class="guest-section">

        <p class="guest-label">
          KEPADA YTH.
        </p>

        <p
          class="guest-name"
          id="guestName">
          Tamu Undangan
        </p>

      </div>


      <!-- Invitation Text -->
      <p class="invitation-text">

        Dengan penuh kebahagiaan, kami mengundang<br>

        Bapak/Ibu/Saudara/i untuk hadir dalam<br>

        momen istimewa pernikahan kami.

      </p>


      <!-- Button -->
      <button
        class="open-button"
        id="openInvitation">

        <span>
          BUKA UNDANGAN
        </span>

        <strong>
          ›
        </strong>

      </button>


      <!-- Hint -->
      <p class="button-hint">
        Tap untuk membuka undangan
      </p>


      <!-- Bottom -->
      <div class="bottom-decoration">

        <span></span>

        <small>
          ANDRE &amp; INTAN
        </small>

        <span></span>

      </div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
